<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dataUtils 自检</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      background: #f6f7fb;
      color: #131a2a;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    h2 { margin: 22px 0 8px; font-size: 15px; }
    #env { margin: 0 0 12px; font-family: Consolas, monospace; font-size: 12px; color: #5b6478; }
    #summary { margin: 10px 0 14px; padding: 10px 14px; border-radius: 10px; font-size: 15px; background: #fff; border: 1px solid #e2e6f0; }
    #summary[data-fail="0"] { border-color: #0b8a68; color: #0b8a68; }
    #summary:not([data-fail="0"]) { border-color: #d92d20; color: #d92d20; }
    ol { margin: 0; padding-left: 26px; font-size: 13px; }
    li { margin: 2px 0; font-family: Consolas, monospace; }
    li.fail { color: #b42318; }
    #failures:empty::after { content: "（无）"; color: #8a93a6; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b111a; color: #e8ecf5; }
      #summary { background: #111722; border-color: #222b3a; }
      #env { color: #95a0b4; }
      li.fail { color: #f87171; }
    }
  </style>
</head>
<body>
  <h1>dataUtils 自检</h1>
  <p id="env">检测环境中…</p>
  <h2 id="summary">运行中…</h2>
  <h2>失败项</h2>
  <ol id="failures"></ol>
  <h2>通过项</h2>
  <ol id="passed"></ol>

  <script src="js/lib/bytes.js?v=10"></script>
  <script src="js/lib/md5.js?v=10"></script>
  <script src="js/lib/date-format.js?v=10"></script>
  <script src="js/lib/sql-format.js?v=10"></script>
  <script src="js/lib/webcrypto.js?v=10"></script>
  <script src="js/lib/radix.js?v=10"></script>
  <script src="js/lib/text-case.js?v=10"></script>
  <script src="js/lib/jwt.js?v=10"></script>
  <script src="js/lib/syntax.js?v=10"></script>
  <script src="js/lib/sql-dialects.js?v=10"></script>
  <script src="js/lib/sql-lint.js?v=10"></script>
  <script>
    (function () {
      'use strict';

      var B = window.Bytes;
      var MD5 = window.MD5;
      var DF = window.DateFormat;
      var SQL = window.SQLFormat;
      var Kit = window.CryptoKit;
      var Radix = window.Radix;
      var TextCase = window.TextCase;
      var JWT = window.JWT;
      var Dialects = window.SQLDialects;
      var Lint = window.SQLLint;

      var pass = 0;
      var fail = 0;
      var failures = [];
      var passed = [];

      function ok(name, actual, expected) {
        if (actual === expected) {
          pass++;
          passed.push(name);
        } else {
          fail++;
          failures.push(name + ' → 期望 ' + JSON.stringify(expected) + '，实际 ' + JSON.stringify(actual));
        }
      }

      function truthy(name, value) {
        ok(name, !!value, true);
      }

      function throws(name, fn) {
        try {
          fn();
          fail++;
          failures.push(name + ' → 应当抛出异常但没有');
        } catch (err) {
          pass++;
          passed.push(name);
        }
      }

      function hexOf(bytes) {
        return B.bytesToHex(bytes);
      }

      function equalsAsync(name, promise, expected) {
        return promise.then(function (value) {
          ok(name, value, expected);
        }, function (err) {
          fail++;
          failures.push(name + ' → 抛出 ' + (err && err.message ? err.message : err));
        });
      }

      function section(title) {
        passed.push('— ' + title + ' —');
      }

      /* ---------------- 环境 ---------------- */

      var envText = 'protocol=' + location.protocol +
        ' · isSecureContext=' + String(window.isSecureContext) +
        ' · crypto.subtle=' + (window.crypto && window.crypto.subtle ? 'yes' : 'no') +
        ' · TextEncoder=' + (typeof TextEncoder !== 'undefined') +
        ' · BigInt=' + (typeof BigInt !== 'undefined');
      document.getElementById('env').textContent = envText;

      /* ---------------- Base64 / Hex / 填充 ---------------- */

      section('编码');

      var rfc4648 = [['', ''], ['f', 'Zg=='], ['fo', 'Zm8='], ['foo', 'Zm9v'], ['foob', 'Zm9vYg=='], ['fooba', 'Zm9vYmE='], ['foobar', 'Zm9vYmFy']];
      rfc4648.forEach(function (pair) {
        ok('Base64 "' + pair[0] + '"', B.utf8ToBase64(pair[0]), pair[1]);
        ok('Base64 解码 "' + pair[1] + '"', B.base64ToUtf8(pair[1]), pair[0]);
      });

      ok('Base64 中文往返', B.base64ToUtf8(B.utf8ToBase64('中文😀')), '中文😀');
      ok('Base64URL', B.bytesToBase64Url(B.utf8Encode('subjects?_d')), 'c3ViamVjdHM_X2Q');
      ok('Base64URL 解码', B.utf8Decode(B.base64UrlToBytes('c3ViamVjdHM_X2Q')), 'subjects?_d');
      ok('Base64 缺填充', B.base64ToUtf8('Zm9vYg'), 'foob');
      throws('Base64 非法字符报错', function () { B.base64ToBytes('abc$def'); });

      ok('Hex 编码', hexOf(B.utf8Encode('A')), '41');
      ok('Hex 解码', B.utf8Decode(B.hexToBytes('E4B8AD')), '中');
      throws('Hex 奇数长度报错', function () { B.hexToBytes('ABC'); });

      for (var len = 0; len <= 33; len += 1) {
        var data = new Uint8Array(len).fill(7);
        var padded = B.pkcs7Pad(data, 16);
        ok('PKCS#7 长度 ' + len, padded.length, Math.ceil((len + 1) / 16) * 16);
        ok('PKCS#7 往返 ' + len, hexOf(B.pkcs7Unpad(padded, 16)), hexOf(data));
      }
      throws('PKCS#7 非法填充报错', function () { B.pkcs7Unpad(new Uint8Array(16).fill(0), 16); });

      /* ---------------- MD5 ---------------- */

      section('MD5');

      var md5Vectors = [
        ['', 'd41d8cd98f00b204e9800998ecf8427e'],
        ['a', '0cc175b9c0f1b6a831c399e269772661'],
        ['abc', '900150983cd24fb0d6963f7d28e17f72'],
        ['message digest', 'f96b697d7cb7938d525a2f31aaf161d0'],
        ['abcdefghijklmnopqrstuvwxyz', 'c3fcd3d76192e4007dfb496cca67e13b'],
        ['ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', 'd174ab98d277d9f5a5611c2c9f419d9f'],
        ['12345678901234567890123456789012345678901234567890123456789012345678901234567890', '57edf4a22be3c955ac49da2e2107b67a']
      ];
      md5Vectors.forEach(function (pair) {
        ok('MD5 "' + pair[0].slice(0, 18) + '"', MD5.hex(pair[0]), pair[1]);
      });
      [55, 56, 63, 64, 65, 128].forEach(function (size) {
        var text = new Array(size + 1).join('x');
        ok('MD5 边界 ' + size, MD5.hex(text).length, 32);
      });

      /* ---------------- SQL ---------------- */

      section('SQL');

      var sqlCases = [
        'select a,b from t where x=1 and y=2',
        "SELECT * FROM t WHERE note = 'a--b' AND path = '/*x*/'",
        'INSERT INTO t (a, b) VALUES (1, 2), (3, 4)',
        'SELECT CASE WHEN a > 0 THEN 1 ELSE 0 END AS s FROM t',
        'WITH x AS (SELECT id FROM t) SELECT * FROM x',
        "DELETE FROM t WHERE d < NOW() - INTERVAL 7 DAY"
      ];

      sqlCases.forEach(function (source, index) {
        var before = SQL.signature(SQL.tokenize(source));
        var formatted = SQL.format(source, { indent: 2 }).text;
        var after = SQL.signature(SQL.tokenize(formatted));

        ok('SQL 格式化保持 token 序列 #' + index, after, before);
        ok('SQL 格式化幂等 #' + index, SQL.format(formatted, { indent: 2 }).text, formatted);

        var minified = SQL.minify(source).text;
        ok('SQL 压缩保持 token 序列 #' + index, SQL.signature(SQL.tokenize(minified)), before);
      });

      ok('SQL 字符串内分号不分句', SQL.tokenize("SELECT 'a;b'").filter(function (token) { return token.value === ';'; }).length, 0);
      ok('SQL 行注释计数', SQL.minify('SELECT 1 -- x\n, 2 /* y */').removedComments, 2);
      truthy('SQL 压缩不拼出 -- 注释', SQL.minify('SELECT a - -1 FROM t').text.indexOf('--') < 0);
      throws('SQL 未闭合字符串报错', function () { SQL.tokenize("SELECT 'abc"); });

      /* ---------------- SQL 方言 ---------------- */

      section('SQL 方言');

      ok('方言数量', Dialects.LIST.length, 16);
      ok('方言顺序首项', Dialects.LIST[0].id, 'ansi');
      truthy('MySQL 方言存在', !!Dialects.byId('mysql'));
      ok('达梦别名 DM8', Dialects.byId('DM8').id, 'dm');
      ok('金仓别名 kingbasees', Dialects.byId('kingbasees').id, 'kingbase');
      ok('SQL Server 别名 mssql', Dialects.byId('mssql').id, 'sqlserver');
      ok('未知方言回落 ansi', Dialects.byId('不存在的方言').id, 'ansi');

      truthy('每种方言都有关键字', Dialects.LIST.every(function (d) { return d.keywords.split(/\s+/).length > 100; }));
      truthy('达梦关键字表含 ROWNUM', !!Dialects.keywordSet('dm').ROWNUM);
      truthy('金仓关键字表含 NVL', !!Dialects.keywordSet('kingbase').NVL);
      truthy('ClickHouse 关键字表含 PREWHERE', !!Dialects.keywordSet('clickhouse').PREWHERE);
      truthy('MySQL 关键字表含 LIMIT', !!Dialects.keywordSet('mysql').LIMIT);
      truthy('PostgreSQL 运算符含 ->', Dialects.operatorList('postgresql').indexOf('->') >= 0);
      truthy('MySQL 运算符含 <=>', Dialects.operatorList('mysql').indexOf('<=>') >= 0);

      ok('识别 Oracle（ROWNUM）', Dialects.detect('SELECT ROWNUM FROM t'), 'oracle');
      ok('识别 MySQL（反引号）', Dialects.detect('SELECT `a` FROM t'), 'mysql');
      ok('识别 SQL Server（TOP）', Dialects.detect('SELECT TOP 10 * FROM t'), 'sqlserver');
      ok('识别 PostgreSQL（::）', Dialects.detect('SELECT a::int FROM t'), 'postgresql');
      ok('识别 ClickHouse（PREWHERE）', Dialects.detect('SELECT * FROM t PREWHERE x'), 'clickhouse');
      ok('识别 Db2（WITH UR）', Dialects.detect('SELECT * FROM t WITH UR'), 'db2');
      ok('识别 SQLite（PRAGMA）', Dialects.detect('PRAGMA table_info(t)'), 'sqlite');
      ok('无法判定时回落 ansi', Dialects.detect('SELECT 1'), 'ansi');

      /* ---------------- SQL 多方言格式化 ---------------- */

      section('SQL 多方言');

      var dialectCases = [
        ['mysql', 'SELECT `u`.`id`, IFNULL(o.total, 0) AS t FROM `users` u LEFT JOIN `orders` o ON u.id = o.user_id LIMIT 0, 20'],
        ['postgresql', "SELECT a::int, b->>'x' FROM t WHERE c ILIKE '%x%'"],
        ['oracle', 'SELECT NVL(a, 0), DECODE(b, 1, 2) FROM t WHERE ROWNUM <= 10'],
        ['dm', 'SELECT ROWNUM, NVL(a, 0) FROM t'],
        ['kingbase', "SELECT LISTAGG(b, ',') WITHIN GROUP (ORDER BY b) FROM t"],
        ['sqlserver', 'SELECT TOP 10 [a b], ISNULL(c, 0) FROM dbo.t WITH (NOLOCK)'],
        ['sqlite', "SELECT strftime('%Y', d), group_concat(x) FROM t WHERE a GLOB 'x*'"],
        ['clickhouse', 'SELECT toDate(d) AS day, uniqExact(uid) FROM t PREWHERE d > today() - 7 GROUP BY day']
      ];

      dialectCases.forEach(function (pair) {
        var id = pair[0];
        var source = pair[1];
        var before = SQL.signature(SQL.tokenize(source, { dialect: id }));
        var formatted = SQL.format(source, { indent: 2, dialect: id }).text;
        var after = SQL.signature(SQL.tokenize(formatted, { dialect: id }));
        var minified = SQL.minify(source, { dialect: id }).text;

        ok('方言 ' + id + ' 格式化保持 token 序列', after, before);
        ok('方言 ' + id + ' 幂等', SQL.format(formatted, { indent: 2, dialect: id }).text, formatted);
        ok('方言 ' + id + ' 压缩保持 token 序列', SQL.signature(SQL.tokenize(minified, { dialect: id })), before);
      });

      ok('未知方言按通用规则格式化',
        SQL.signature(SQL.tokenize(SQL.format('select a from t', { indent: 2, dialect: 'nope' }).text)),
        SQL.signature(SQL.tokenize('select a from t')));
      truthy('MySQL 方言的关键字集合可用', !!SQL.keywordsFor('mysql').LIMIT);
      truthy('达梦方言的关键字集合可用', !!SQL.keywordsFor('dm').ROWNUM);

      /* ---------------- SQL 语法检查 ---------------- */

      section('SQL 语法检查');

      function diagCodes(sql, dialect) {
        return Lint.lint(sql, { dialect: dialect || 'mysql' }).diagnostics.map(function (item) {
          return item.code;
        });
      }

      ok('正常 SQL 无错误', diagCodes("select u.id, count(*) from users u left join orders o on u.id = o.user_id where u.status = 'paid' group by u.id limit 10").filter(function (code) {
        return code === 'E_TRAILING_COMMA' || code === 'E_UNCLOSED_STRING';
      }).length, 0);

      truthy('尾逗号报错', diagCodes('SELECT a, FROM t').indexOf('E_TRAILING_COMMA') >= 0);
      truthy('未闭合字符串报错', diagCodes("SELECT 'abc").indexOf('E_UNCLOSED_STRING') >= 0);
      truthy('未闭合注释报错', diagCodes('SELECT 1 /* x').indexOf('E_UNCLOSED_COMMENT') >= 0);
      truthy('括号不配对报错', diagCodes('SELECT (1 FROM t').indexOf('E_UNBALANCED_PAREN') >= 0);
      truthy('JOIN 缺 ON 提示', diagCodes('SELECT a FROM t1 JOIN t2').indexOf('E_JOIN_NO_ON') >= 0);
      truthy('子句顺序报错', diagCodes('SELECT a FROM t WHERE x = 1 ORDER BY a GROUP BY a').indexOf('E_CLAUSE_ORDER') >= 0);
      truthy('INSERT 缺 VALUES 报错', diagCodes('INSERT INTO t (a, b)').indexOf('E_MISSING_VALUES') >= 0);
      truthy('DELETE 无 WHERE 警告', diagCodes('DELETE FROM t').indexOf('W_NO_WHERE') >= 0);
      truthy('UPDATE 无 WHERE 警告', diagCodes('UPDATE t SET a = 1').indexOf('W_NO_WHERE') >= 0);
      truthy('悬空 WHERE 报错', diagCodes('SELECT a FROM t WHERE').indexOf('E_DANGLING_KEYWORD') >= 0);
      truthy('方言差异提示（MySQL 用 TOP）', diagCodes('SELECT TOP 10 * FROM t', 'mysql').indexOf('H_DIALECT_KEYWORD') >= 0);

      var lintResult = Lint.lint('SELECT a, FROM t', { dialect: 'mysql' });
      truthy('诊断带行号', lintResult.diagnostics[0].line === 1);
      truthy('诊断带列号', lintResult.diagnostics[0].column > 0);
      truthy('诊断偏移在文本范围内',
        lintResult.diagnostics.every(function (item) {
          return item.start >= 0 && item.end <= 38 && item.end > item.start - 1;
        }));
      ok('诊断按位置排序', lintResult.diagnostics.every(function (item, index, list) {
        return index === 0 || list[index - 1].start <= item.start;
      }), true);
      ok('空输入无诊断', Lint.lint('').diagnostics.length, 0);
      ok('检查不修改成功用例（Oracle）', Lint.lint('SELECT NVL(a, 0) FROM t', { dialect: 'oracle' }).diagnostics.filter(function (item) {
        return item.severity === 'error';
      }).length, 0);
      ok('摘要统计', Lint.summary(lintResult).errors > 0, true);
      ok('无问题时摘要文案', Lint.summary(Lint.lint('SELECT 1')).text, '未发现问题');
      ok('方言由内容自动识别', Lint.lint('SELECT ROWNUM FROM t').dialectId, 'oracle');

      /* ---------------- 日期 ---------------- */

      section('日期');

      ok('UTC 纪元', DF.parse('1970-01-01 00:00:00', { zone: 'utc' }).epochMs, 0);
      ok('闰年 2 月 29', DF.parse('2024-02-29', { zone: 'utc' }).epochMs, Date.UTC(2024, 1, 29));
      throws('非闰年 2 月 29 报错', function () { DF.parse('2026-02-29', { zone: 'utc' }); });
      throws('24 点报错', function () { DF.parse('2026-01-01 24:00:00', { zone: 'utc' }); });
      ok('ISO Z', DF.parse('2026-11-19T14:03:34Z').epochMs, Date.UTC(2026, 10, 19, 14, 3, 34));
      ok('ISO +08:00', DF.parse('2026-11-19T22:03:34+08:00').epochMs, Date.UTC(2026, 10, 19, 14, 3, 34));
      ok('上海时区换算', DF.parse('2026-11-19 22:03:34', { zone: 'Asia/Shanghai' }).epochMs, Date.UTC(2026, 10, 19, 14, 3, 34));
      ok('10 位识别为秒', DF.parseTimestamp('1763552614').unit, 's');
      ok('13 位识别为毫秒', DF.parseTimestamp('1763552614000').unit, 'ms');
      ok('UTC 格式化', DF.format(new Date(0), 'YYYY-MM-DD HH:mm:ss', { timeZone: 'UTC' }), '1970-01-01 00:00:00');
      ok('ISO 输出（上海）', DF.iso(new Date(0), { timeZone: 'Asia/Shanghai' }), '1970-01-01T08:00:00.000+08:00');
      ok('RFC 2822', DF.rfc2822(new Date(0)), 'Thu, 01 Jan 1970 00:00:00 +0000');

      /* ---------------- 进制 ---------------- */

      section('进制');

      ok('10 → 16', Radix.format(Radix.parse('255', 10), 16), 'ff');
      ok('0xFF → 10', Radix.parse('0xFF', 'auto').toString(10), '255');
      ok('0b1010 → 10', Radix.parse('0b1010', 'auto').toString(10), '10');
      ok('负数', Radix.parse('-10', 10).toString(10), '-10');
      ok('超 64 位', Radix.parse('18446744073709551616', 10).toString(16), '10000000000000000');
      throws('非法字符报错', function () { Radix.parse('12g', 10); });
      throws('超出进制范围报错', function () { Radix.parse('2', 2); });

      /* ---------------- 文本 ---------------- */

      section('文本');

      ok('camelCase', TextCase.camel('user profile name'), 'userProfileName');
      ok('PascalCase', TextCase.pascal('HTTPServer'), 'HttpServer');
      ok('snake_case', TextCase.snake('userProfileName'), 'user_profile_name');
      ok('kebab-case', TextCase.kebab('user_profile_name'), 'user-profile-name');
      ok('CONSTANT_CASE', TextCase.constant('userProfileName'), 'USER_PROFILE_NAME');
      ok('中文保留', TextCase.snake('中文 测试'), '中文_测试');
      ok('标题格式', TextCase.title('hello wORLD'), 'Hello World');
      ok('去重行', TextCase.dedupeLines('a\nb\na'), 'a\nb');
      ok('行排序', TextCase.sortLines('c\na\nb'), 'a\nb\nc');

      /* ---------------- JWT ---------------- */

      section('JWT');

      var sample = JWT.sample();
      var decoded = JWT.decode(sample);
      ok('JWT alg', decoded.header.alg, 'HS256');
      ok('JWT sub', decoded.payload.sub, '1234567890');
      truthy('JWT 签名段长度 > 0', decoded.signatureBytes > 0);
      throws('JWT 段数错误报错', function () { JWT.decode('a.b'); });

      /* ---------------- 语法着色 ---------------- */

      section('语法着色');

      var SYN = window.Syntax;

      ok('未知语言按纯文本转义', SYN.highlight('nope', '<a>'), '&lt;a&gt;');
      ok('纯文本转义', SYN.highlight('text', '<script>'), '&lt;script&gt;');
      truthy('SQL 关键字着色', SYN.highlight('sql', 'SELECT 1').indexOf('syn-kw') >= 0);
      truthy('SQL 字符串不着成关键字', SYN.highlight('sql', "SELECT 'FROM'").indexOf('syn-str') >= 0);
      truthy('SQL 注释着色', SYN.highlight('sql', '-- hi').indexOf('syn-com') >= 0);
      truthy('JSON 键与值区分', SYN.highlight('json', '{"a":1}').indexOf('syn-key') >= 0);
      truthy('JSON 字面量', SYN.highlight('json', '[true,null]').indexOf('syn-null') >= 0);
      truthy('Java 注释', SYN.highlight('java', '// c').indexOf('syn-com') >= 0);
      truthy('Python 注释', SYN.highlight('python', '# c').indexOf('syn-com') >= 0);
      truthy('XML 标签', SYN.highlight('xml', '<a>').indexOf('syn-tag') >= 0);
      truthy('着色不注入 HTML', SYN.highlight('sql', "SELECT '<img src=x>'").indexOf('<img') < 0);

      /* 去掉着色标签并还原实体后必须与原文完全一致 */
      var roundTrip = SYN.highlight('sql', "SELECT 'a<b' & c")
        .replace(/<[^>]+>/g, '')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&amp;/g, '&');
      ok('着色还原原文', roundTrip, "SELECT 'a<b' & c");

      ok('语言识别 SQL', SYN.detect('SELECT a FROM b'), 'sql');
      ok('语言识别 JSON', SYN.detect('{"a":1}'), 'json');
      ok('语言识别 XML', SYN.detect('<a href="x">t</a>'), 'xml');
      ok('语言识别 Java', SYN.detect('public class A {}'), 'java');

      /* ---------------- WebCrypto ---------------- */

      section('摘要');

      var shaCases = [
        ['SHA-1', 'a9993e364706816aba3e25717850c26c9cd0d89d'],
        ['SHA-256', 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'],
        ['SHA-384', 'cb00753f45a35e8bb5a03d699ac65007272c32ab0eded1631a8b605a43ff5bed8086072ba1e7cc2358baeca134c825a7'],
        ['SHA-512', 'ddaf35a193617abacc417349ae20413112e6fa4e89a97ea20a9eeee64b55d39a2192992a274fc1a836ba3c23a3feebbd454d4423643ce80e2a9ac94fa54ca49f']
      ];

      var hmacKey = new Uint8Array(20).fill(0x0b);

      var aesCbcKey = B.hexToBytes('2b7e151628aed2a6abf7158809cf4f3c');
      var aesCbcIv = B.hexToBytes('000102030405060708090a0b0c0d0e0f');
      var aesPlain = B.hexToBytes(
        '6bc1bee22e409f96e93d7e117393172a' +
        'ae2d8a571e03ac9c9eb76fac45af8e51' +
        '30c81c46a35ce411e5fbc1191a0a52ef' +
        'f69f2445df4f9b17ad2b417be66c3710'
      );

      var aesCtrCounter = B.hexToBytes('f0f1f2f3f4f5f6f7f8f9fafbfcfdfeff');
      var gcmKey = B.hexToBytes('feffe9928665731c6d6a8f9467308308');
      var gcmIv = B.hexToBytes('cafebabefacedbaddecaf888');
      var gcmPlain = B.hexToBytes(
        'd9313225f88406e5a55909c5aff5269a' +
        '86a7a9531534f7da2e4c303d8a318a72' +
        '1c3c0c95956809532fcf0e2449a6b525' +
        'b16aedf5aa0de657ba637b391aafd255'
      );

      (async function () {
        if (!Kit.available()) {
          failures.push('WebCrypto 不可用：' + Kit.unavailableReason());
          fail++;
          finish();
          return;
        }

        for (var i = 0; i < shaCases.length; i++) {
          await equalsAsync(shaCases[i][0] + '("abc")', Kit.digest(shaCases[i][0], B.utf8Encode('abc')).then(hexOf), shaCases[i][1]);
        }

        await equalsAsync(
          'HMAC-SHA256（RFC 4231 case 1）',
          Kit.hmac('SHA-256', hmacKey, B.utf8Encode('Hi There')).then(hexOf),
          'b0344c61d8db38535ca8afceaf0bf12b881dc200c9833da726e9376c2e32cff7'
        );

        var nistCbc = '7649abac8119b246cee98e9b12e9197d5086cb9b507219ee95db113a917678b273bed6b8e3c1743b7116e69e222295163ff1caa1681fac09120eca307586e1a7';
        var cbcPromise = Kit.aesEncrypt({ mode: 'CBC', key: aesCbcKey, iv: aesCbcIv, data: aesPlain });

        /* WebCrypto 的 AES-CBC 会自动补 PKCS#7：满块输入会再补一整块，因此只比对前 64 字节 */
        await equalsAsync(
          'AES-128-CBC 前 64 字节（NIST F.2.1）',
          cbcPromise.then(function (bytes) { return hexOf(bytes.slice(0, 64)); }),
          nistCbc
        );

        await equalsAsync(
          'AES-128-CBC 自动补满一块（64 → 80 字节）',
          cbcPromise.then(function (bytes) { return bytes.length; }),
          80
        );

        await equalsAsync(
          'AES-128-CBC 解密往返（浏览器负责去填充）',
          cbcPromise.then(function (bytes) {
            return Kit.aesDecrypt({ mode: 'CBC', key: aesCbcKey, iv: aesCbcIv, data: bytes });
          }).then(hexOf),
          hexOf(aesPlain)
        );

        await equalsAsync(
          'AES-128-CBC 16 字节明文补满为 32 字节',
          Kit.aesEncrypt({ mode: 'CBC', key: aesCbcKey, iv: aesCbcIv, data: aesPlain.subarray(0, 16) })
            .then(function (bytes) { return bytes.length; }),
          32
        );

        await equalsAsync(
          'AES-128-CTR（NIST F.5.1）',
          Kit.aesEncrypt({ mode: 'CTR', key: aesCbcKey, iv: aesCtrCounter, data: aesPlain }).then(hexOf),
          '874d6191b620e3261bef6864990db6ce9806f66b7970fdff8617187bb9fffdff5ae4df3edbd5d35e5b4f09020db03eab1e031dda2fbe03d1792170a0f3009cee'
        );

        await equalsAsync(
          'AES-128-GCM（NIST case 3，含 tag）',
          Kit.aesEncrypt({ mode: 'GCM', key: gcmKey, iv: gcmIv, data: gcmPlain }).then(hexOf),
          '42831ec2217774244b7221b784d0d49ce3aa212f2c02a4e035c17e2329aca12e21d514b25466931c7d8f6a5aac84aa051ba30b396a0aac973d58e091473f5985' + '4d5c2af327cd64a62cf35abd2ba6fab4'
        );

        await equalsAsync(
          'AES-GCM 空明文（case 1，仅 tag）',
          Kit.aesEncrypt({ mode: 'GCM', key: new Uint8Array(16), iv: new Uint8Array(12), data: new Uint8Array(0) }).then(hexOf),
          '58e2fccefa7e3061367f1d57a4e7455a'
        );

        await equalsAsync(
          'AES 往返（随机密钥 / IV）',
          Kit.aesEncrypt({
            mode: 'GCM',
            key: B.randomBytes(32),
            iv: B.randomBytes(12),
            data: B.utf8Encode('roundtrip 加密往返')
          }).then(function () { return 'ok'; }),
          'ok'
        );

        finish();
      })();

      /* ---------------- 收尾 ---------------- */

      function finish() {
        var summary = document.getElementById('summary');
        summary.setAttribute('data-pass', String(pass));
        summary.setAttribute('data-fail', String(fail));
        summary.textContent = '通过 ' + pass + ' 项 · 失败 ' + fail + ' 项';

        var failureList = document.getElementById('failures');
        failureList.textContent = '';
        failures.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'fail';
          li.textContent = item;
          failureList.appendChild(li);
        });

        var passedList = document.getElementById('passed');
        passedList.textContent = '';
        passed.forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item;
          passedList.appendChild(li);
        });

        document.body.setAttribute('data-result', fail === 0 ? 'pass' : 'fail');
        document.title = (fail === 0 ? 'PASS' : 'FAIL') + ' · ' + pass + '/' + (pass + fail) + ' · dataUtils 自检';
      }
    })();
  </script>
</body>
</html>
